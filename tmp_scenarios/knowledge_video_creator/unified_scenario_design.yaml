# ============================================
# knowledge_video_creator — 统一场景设计配置
# ============================================
# 技术知识讲解视频创作：用户提供技术文档/方法论资料，
# Agent完成知识提炼→视频脚本创作→素材制作的全流程。

scenario_name: "技术知识讲解视频创作 — 从技术文档到可播放视频教程"
sub_scenario_type: knowledge_video_creator
description: |
  测试Agent的多媒体视频制作能力：用户提供技术文档/方法论资料（5000-15000字），
  Agent需完成知识提炼→视频脚本→视频素材制作（PPT+TTS配音+配图）的全流程。
  
  与 novel_to_script / shortdrama 场景的关键区别：
  1. 交付物不是JSON文档，而是可直接播放的PPT+音频+图片素材包
  2. MCP工具集包含多媒体生成能力（create_ppt, text_to_speech, generate_image）
  3. 测试Agent编排多工具生产Pipeline的能力，不只是文本创作
  
  核心测试能力：知识提炼、教学设计、视觉化设计、**多媒体生产Pipeline编排**。
domain: creative_content

# ============================================
# 运行时配置
# ============================================

runtime_config:
  system_time: "2025-07-20T14:00:00Z"
  timezone: Asia/Shanghai

# ============================================
# MCP 服务配置
# ============================================

mcp_service_config:
  service_name: knowledge_video_creator_service
  service_description: |
    技术知识讲解视频创作服务。
    提供文件系统操作 + 多媒体制作工具（PPT生成、TTS配音、图片生成、代码执行）。
  command: python
  args:
    - env/knowledge_video_creator_service.py
    - ${ENV_DIR}
  tools_description:
    read_file: 读取文件内容（源技术文档、skill手册、output规范、已创建的文件）
    write_file: 写入单个文件内容
    list_directory: 列出目录内容
    create_directory: 创建目录
    create_ppt: 生成PPT文件（接受JSON结构化幻灯片描述，输出.pptx）
    text_to_speech: 文字转语音（输出.mp3配音文件）
    generate_image: AI图片生成（概念图、架构图、示意图）
    execute_code: 执行Python代码（用于matplotlib图表生成等高级可视化）

# ============================================
# 环境文件定义
# ============================================

environment:
  description: |
    每个样本的环境包含：源技术文档、Skill参考文档、输出格式规范。
    源技术文档是唯一的样本特有文件，其余为公共资源。
  
  workspace_files:
    # 样本特有文件（可能有多个源材料）
    - path: source_materials/
      description: 源技术文档（Markdown格式，5000-15000字，可以是1-3个文件）
      required: true
      per_sample: true
      note: 创作的基础素材，放在workspace/source_materials/目录

    # 公共Skill文件
    - path: data_pools/skills/video_script_guide.md
      description: 视频脚本写作指南（教学视频的脚本结构、口播写作、节奏设计）
      required: true

    - path: data_pools/skills/visual_design_guide.md
      description: 视觉设计指南（PPT设计、图表规范、代码展示、动画效果）
      required: true

    # 输出格式规范
    - path: data_pools/schemas/output_specifications.yaml
      description: 两个交付文件（knowledge_analysis、video_script）的字段定义和格式要求
      required: true

# ============================================
# 业务规则（引用外部文件）
# ============================================

business_rules:
  file: BusinessRules.md
  description: |
    Agent的system prompt，定义了：
    - 角色定位（技术内容创作者）
    - 4步线性创作流程（阅读→知识提炼→视频脚本→素材制作）
    - Skill文件引用
    - 硬性规则（格式、内容、教学设计）

# ============================================
# 交付物定义
# ============================================

output_specification:
  description: |
    Agent需要输出两层交付物：
    1. 中间产物（JSON文档）：知识提炼、视频脚本
    2. 最终产物（多媒体文件）：PPT + 配音音频 + 配图
  
  deliverables:
    - file_id: knowledge_analysis
      path: workspace/knowledge_analysis.json
      description: 知识提炼文档（知识体系概述、核心概念、关键洞察、难点分析、视觉化潜力）
      format: json
      sop_stage: step_2

    - file_id: video_script
      path: workspace/video_script.json
      description: 视频脚本（视频定位、学习路径、脚本正文、视觉素材清单、互动设计）
      format: json
      sop_stage: step_3

    - file_id: ppt_file
      path: workspace/videos/slides.pptx
      description: PPT文件（通过create_ppt工具生成的.pptx文件）
      format: pptx
      sop_stage: step_4

    - file_id: narration_file
      path: workspace/videos/narration.mp3
      description: 配音文件（通过text_to_speech工具生成的.mp3文件）
      format: mp3
      sop_stage: step_4

    - file_id: manifest_file
      path: workspace/videos/manifest.json
      description: 素材清单（PPT、音频、图片的路径和播放顺序）
      format: json
      sop_stage: step_4

  workspace_structure: |
    workspace/
    ├── source_materials/          # 源技术文档（环境预置）
    │   ├── main_doc.md
    │   └── (supplement_doc.md)
    ├── knowledge_analysis.json    # Step 2 输出：知识提炼
    ├── video_script.json          # Step 3 输出：视频脚本
    └── videos/                    # Step 4 输出：视频素材包
        ├── slides.pptx            # PPT文件
        ├── narration.mp3          # 配音音频
        ├── images/                # 配图
        │   ├── architecture.png
        │   └── ...
        └── manifest.json          # 素材清单

# ============================================
# 需求模板定义
# ============================================

# 3篇源材料 × 1模板 = 3个样本
# 面向专业技术人员，不区分受众层级

user_need_templates:

  # ────────────────────────────────
  # 模板1: 创意类评测场景构建方法论
  # ────────────────────────────────
  - need_template_id: KVC_CREATIVE_SCENARIO
    description: 创意类Agent评测场景的完整构建方法论（小说/短剧/文案）
    test_type: positive

    entity_filters:
      source_materials:
        topic: creative_scenario

    creation_params: {}

    user_need_description: |
      我有一份关于创意类AI Agent评测场景构建的方法论文档，内容涵盖小说写作、短剧编写、小说改编剧本等场景的评测设计经验。想做成一个视频教程。
      
      源技术文档在工作目录的 `source_materials/` 中，请阅读后开始创作。
      
      【最终交付】
      - knowledge_analysis.json（知识提炼文档）
      - video_script.json（视频脚本）
      - videos/ 目录下的多媒体素材（PPT、配音、配图）

    system_prompt_additions: ""
    user_simulator_prompt: |
      你是一位AI工程师，正在负责Agent评测项目。
      如果Agent询问你任何问题，你就简短回答。
      等待Agent完成所有交付物。

  # ────────────────────────────────
  # 模板2: Query构造方法论
  # ────────────────────────────────
  - need_template_id: KVC_QUERY_CONSTRUCTION
    description: 评测Query的标准化构造方法论（四要素、变量池、组合策略）
    test_type: positive

    entity_filters:
      source_materials:
        topic: query_construction

    creation_params: {}

    user_need_description: |
      我有一份关于评测Query构造方法论的文档，讲的是如何从种子Query解构出四要素，设计变量池，通过组合策略规模化生产高质量测试Query。想做成一个视频教程。
      
      源技术文档在工作目录的 `source_materials/` 中，请阅读后开始创作。
      
      【最终交付】
      - knowledge_analysis.json（知识提炼文档）
      - video_script.json（视频脚本）
      - videos/ 目录下的多媒体素材（PPT、配音、配图）

    system_prompt_additions: ""
    user_simulator_prompt: |
      你是一位负责AI评测数据建设的工程师。
      如果Agent询问你任何问题，你就简短回答。
      等待Agent完成所有交付物。

  # ────────────────────────────────
  # 模板3: Agent评测方法论（Anthropic视角）
  # ────────────────────────────────
  - need_template_id: KVC_AGENT_EVAL
    description: AI Agent评测方法论（评测结构、Grader类型、从0到1路线图）
    test_type: positive

    entity_filters:
      source_materials:
        topic: agent_eval

    creation_params: {}

    user_need_description: |
      我有一份Anthropic发布的关于AI Agent评测方法论的技术文章（英文），系统讲解了Agent评测的结构、Grader类型、不同Agent类型的评测策略、以及从零搭建评测体系的路线图。想做成一个中文视频教程。
      
      【创作要求】
      - 源材料是英文，视频用中文讲解，关键术语保留英文原文
      
      源技术文档在工作目录的 `source_materials/` 中，请阅读后开始创作。
      
      【最终交付】
      - knowledge_analysis.json（知识提炼文档）
      - video_script.json（视频脚本）
      - videos/ 目录下的多媒体素材（PPT、配音、配图）

    system_prompt_additions: ""
    user_simulator_prompt: |
      你是一位正在搭建Agent评测体系的技术负责人。
      如果Agent询问你任何问题，你就简短回答。
      等待Agent完成所有交付物。

  # ────────────────────────────────
  # 模板4: Agent评测Skills完整指南（7步流程）
  # ────────────────────────────────
  - need_template_id: KVC_EVAL_SKILLS_GUIDE
    description: Agent评测标准化7步流程的完整实操指南（从场景设计到失败分析）
    test_type: positive

    entity_filters:
      source_materials:
        topic: eval_skills_guide

    creation_params: {}

    user_need_description: |
      我有一份Agent评测标准化流程的完整指南文档，覆盖了从场景设计、业务规则编写、工具实现、检查器实现、样本编写、评测执行到失败分析的7个步骤。想做成一个视频教程。
      
      源技术文档在工作目录的 `source_materials/` 中，请阅读后开始创作。
      
      【最终交付】
      - knowledge_analysis.json（知识提炼文档）
      - video_script.json（视频脚本）
      - videos/ 目录下的多媒体素材（PPT、配音、配图）

    system_prompt_additions: ""
    user_simulator_prompt: |
      你是一位正在搭建Agent自动化评测系统的技术负责人。
      如果Agent询问你任何问题，你就简短回答。
      等待Agent完成所有交付物。

  # ────────────────────────────────
  # 模板5: 长时运行Agent的有效工具链（Anthropic）
  # ────────────────────────────────
  - need_template_id: KVC_LONG_RUNNING_AGENTS
    description: 长时间运行Agent的工具链设计（初始化Agent+编码Agent两段式、环境管理、增量进度）
    test_type: positive

    entity_filters:
      source_materials:
        topic: long_running_agents

    creation_params: {}

    user_need_description: |
      我有一篇Anthropic工程团队发布的技术博客（英文），讲的是如何为长时间运行的AI Agent设计有效的工具链——核心方案是"初始化Agent + 编码Agent"的两段式架构。想做成一个中文视频教程。
      
      【创作要求】
      - 源材料是英文，视频用中文讲解，关键术语保留英文原文
      
      源技术文档在工作目录的 `source_materials/` 中，请阅读后开始创作。
      
      【最终交付】
      - knowledge_analysis.json（知识提炼文档）
      - video_script.json（视频脚本）
      - videos/ 目录下的多媒体素材（PPT、配音、配图）

    system_prompt_additions: ""
    user_simulator_prompt: |
      你是一位正在开发长时间Agent任务系统的AI工程师。
      如果Agent询问你任何问题，你就简短回答。
      等待Agent完成所有交付物。
