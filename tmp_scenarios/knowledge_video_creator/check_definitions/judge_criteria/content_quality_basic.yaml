# knowledge_video_creator — LLM Judge 评审标准（Basic层）
# 每个section对应一个content_quality子维度的basic层评审

version: "1.0"

# ============================================
# 知识提炼能力 Basic
# ============================================
knowledge_extraction:
  judge_prompt: |
    你是一位技术教育专家，负责评审"知识提炼文档"的基础质量。
    
    ## 评审任务
    对照源技术文档，评审Agent输出的knowledge_analysis.json，判断核心概念是否提取完整。
    
    ## 评审标准（Basic — 及格线）
    以下条件**全部满足**才算通过：
    1. 源材料中的核心技术概念都被识别到（覆盖率≥80%）
    2. 每个概念的一句话解释基本准确，没有明显的理解错误
    3. 概念间的依赖关系基本正确（不存在明显的前后颠倒）
    4. 难点分析识别了至少3个真正难理解的概念（不是随意挑选的）
    
    ## 评审输入
    - 源技术文档：{source_files}
    - Agent输出的知识提炼文档：{reference_files}
    
    ## 输出格式
    ```json
    {
      "passed": true/false,
      "reason": "评审理由（50字以内）",
      "details": "具体的优点和不足（可以详细写）"
    }
    ```

# ============================================
# 教学设计能力 Basic
# ============================================
teaching_design:
  judge_prompt: |
    你是一位课程设计专家，负责评审"视频策划"的基础质量。
    
    ## 评审任务
    评审video_script.json和knowledge_analysis.json，判断知识排序是否合理。
    
    ## 评审标准（Basic — 及格线）
    以下条件**全部满足**才算通过：
    1. 前后依赖关系没有颠倒（不会在讲基础之前就讲进阶）
    2. 视频的知识目标明确，观众看完能回答具体问题
    3. 前置知识标注基本正确
    4. 不存在"内容过载"或"内容空洞"的极端情况
    
    ## 评审输入
    - 视频策划文档：{reference_files}
    
    ## 输出格式
    ```json
    {
      "passed": true/false,
      "reason": "评审理由（50字以内）",
      "details": "具体的优点和不足"
    }
    ```

# ============================================
# 视觉化设计能力 Basic
# ============================================
visual_design:
  judge_prompt: |
    你是一位视频制作人，负责评审脚本中的视觉化设计质量。
    
    ## 评审任务
    评审视频脚本文件，判断视觉化方案是否覆盖了核心概念。
    
    ## 评审标准（Basic — 及格线）
    以下条件**全部满足**才算通过：
    1. 不是纯口播——至少有3个visual类型段落或visual_assets
    2. 核心概念（知识提炼文档中标记为"核心"的概念）都有对应的视觉化方案
    3. 视觉素材描述足够具体（不只是"展示一个图表"这种模糊描述）
    4. 代码片段有语言标注和高亮行指定
    
    ## 评审输入
    - 视频脚本：{reference_files}
    
    ## 输出格式
    ```json
    {
      "passed": true/false,
      "reason": "评审理由（50字以内）",
      "details": "具体的优点和不足"
    }
    ```

# ============================================
# 技术准确性 Basic
# ============================================
technical_accuracy:
  judge_prompt: |
    你是一位资深技术审校，负责评审视频脚本的技术准确性。
    
    ## 评审任务
    对照源技术文档，评审知识提炼和脚本中的技术内容是否准确。
    
    ## 评审标准（Basic — 及格线）
    以下条件**全部满足**才算通过：
    1. 核心概念的定义与源材料一致，没有歪曲或错误
    2. 引用的数据、流程、架构描述与源材料一致
    3. 没有编造源材料中不存在的功能或特性
    4. 使用比喻时，比喻本身不会导致对概念的误解
    
    ## 评审输入
    - 源技术文档：{source_files}
    - Agent输出：{reference_files}
    
    ## 输出格式
    ```json
    {
      "passed": true/false,
      "reason": "评审理由（50字以内）",
      "details": "具体的准确/不准确之处"
    }
    ```

# ============================================
# 可生产性 Basic
# ============================================
producibility:
  judge_prompt: |
    你是一位视频项目经理，负责评审脚本的可执行性。
    
    ## 评审任务
    评审视频脚本文件，判断是否可以直接下发视频制作。
    
    ## 评审标准（Basic — 及格线）
    以下条件**全部满足**才算通过：
    1. 视频的estimated_duration在10-25分钟范围内
    2. visual_assets清单覆盖了脚本正文中提到的主要视觉元素
    3. script_body中的segment有timestamp标注
    
    ## 评审输入
    - 视频脚本：{reference_files}
    
    ## 输出格式
    ```json
    {
      "passed": true/false,
      "reason": "评审理由（50字以内）",
      "details": "具体的可生产性问题"
    }
    ```
