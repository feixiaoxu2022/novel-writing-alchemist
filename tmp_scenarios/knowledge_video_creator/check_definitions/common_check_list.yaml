# knowledge_video_creator — 通用检查项定义
# 适用于所有模板的公共检查项
# 每个样本还会叠加模板特有的检查项（如源材料特有的概念覆盖等）

version: "1.0"
created_at: "2026-02-19"

common_checks:

  # ============================================
  # 维度1: 格式规范遵循 (format_compliance)
  # ============================================

  # ── JSON语法 ──
  - check_id: "knowledge_analysis_json_valid"
    check_name: "knowledge_analysis.json 是合法JSON"
    dimension_id: format_compliance
    subcategory_id: json_syntax
    check_type: json_schema
    params:
      file_path: "workspace/knowledge_analysis.json"
    description: "knowledge_analysis.json文件存在且是语法正确的JSON"
    is_gate: false
    is_critical: true
    weight: 1.0

  - check_id: "video_script_json_valid"
    check_name: "video_script.json 是合法JSON"
    dimension_id: format_compliance
    subcategory_id: json_syntax
    check_type: json_schema
    params:
      file_path: "workspace/video_script.json"
    description: "video_script.json文件存在且是语法正确的JSON"
    is_gate: false
    is_critical: true
    weight: 1.0

  # ── 结构完整性 ──
  - check_id: "knowledge_analysis_required_fields"
    check_name: "knowledge_analysis.json 包含所有必需字段"
    dimension_id: format_compliance
    subcategory_id: structural_integrity
    check_type: entity_attribute_equals
    params:
      file_path: "workspace/knowledge_analysis.json"
      required_fields:
        - "knowledge_overview"
        - "core_concepts"
        - "key_insights"
        - "difficulty_analysis"
        - "visual_potential"
    description: "知识提炼文档包含5个必需顶层字段"
    is_gate: false
    is_critical: true
    weight: 1.0

  - check_id: "video_script_required_fields"
    check_name: "video_script.json 包含所有必需字段"
    dimension_id: format_compliance
    subcategory_id: structural_integrity
    check_type: entity_attribute_equals
    params:
      file_path: "workspace/video_script.json"
      required_fields:
        - "video_positioning"
        - "learning_path"
        - "script_body"
        - "visual_assets"
        - "interaction_design"
    description: "视频脚本包含5个必需顶层字段"
    is_gate: false
    is_critical: true
    weight: 1.0

  # ============================================
  # 维度2: 业务规则遵循 (business_rule_compliance)
  # ============================================

  # ── 交付完整性 ──
  - check_id: "knowledge_analysis_exists"
    check_name: "knowledge_analysis.json 已创建"
    dimension_id: business_rule_compliance
    subcategory_id: output_completeness
    check_type: entity_attribute_equals
    params:
      check_subtype: file_exists
      file_path: "workspace/knowledge_analysis.json"
    description: "Step 2的交付物knowledge_analysis.json存在"
    is_gate: false
    is_critical: true
    weight: 1.0

  - check_id: "video_script_exists"
    check_name: "video_script.json 已创建"
    dimension_id: business_rule_compliance
    subcategory_id: output_completeness
    check_type: entity_attribute_equals
    params:
      check_subtype: file_exists
      file_path: "workspace/video_script.json"
    description: "Step 3的交付物video_script.json存在"
    is_gate: false
    is_critical: true
    weight: 1.0

  # ── Skill文件读取 ──
  - check_id: "read_source_materials"
    check_name: "读取了源材料文件"
    dimension_id: business_rule_compliance
    subcategory_id: skill_reading
    check_type: tool_called_with_params
    params:
      tool_name: "read_file"
      required_calls:
        - params_contain:
            path: "source_materials/"
      min_call_count: 1
    description: "Agent在创作前读取了source_materials目录下的源材料"
    is_gate: false
    is_critical: true
    weight: 1.0

  - check_id: "read_video_script_guide"
    check_name: "读取了视频脚本写作指南"
    dimension_id: business_rule_compliance
    subcategory_id: skill_reading
    check_type: tool_called_with_params
    params:
      tool_name: "read_file"
      required_calls:
        - params_contain:
            path: "data_pools/skills/video_script_guide.md"
    description: "Agent读取了video_script_guide.md"
    is_gate: false
    is_critical: false
    weight: 1.0

  - check_id: "read_visual_design_guide"
    check_name: "读取了视觉设计指南"
    dimension_id: business_rule_compliance
    subcategory_id: skill_reading
    check_type: tool_called_with_params
    params:
      tool_name: "read_file"
      required_calls:
        - params_contain:
            path: "data_pools/skills/visual_design_guide.md"
    description: "Agent读取了visual_design_guide.md"
    is_gate: false
    is_critical: false
    weight: 1.0

  - check_id: "read_output_specifications"
    check_name: "读取了输出格式规范"
    dimension_id: business_rule_compliance
    subcategory_id: skill_reading
    check_type: tool_called_with_params
    params:
      tool_name: "read_file"
      required_calls:
        - params_contain:
            path: "data_pools/schemas/output_specifications.yaml"
    description: "Agent读取了output_specifications.yaml"
    is_gate: false
    is_critical: false
    weight: 1.0

  # ── 数量约束 ──
  - check_id: "core_concepts_count"
    check_name: "核心概念数量在6-15个范围内"
    dimension_id: business_rule_compliance
    subcategory_id: quantity_constraint
    check_type: entity_attribute_equals
    params:
      file_path: "workspace/knowledge_analysis.json"
      field: "core_concepts"
      check_subtype: array_length_range
      min_length: 6
      max_length: 15
    description: "knowledge_analysis中的core_concepts数量在6-15之间"
    is_gate: false
    is_critical: false
    weight: 1.0

  - check_id: "key_insights_count"
    check_name: "关键洞察数量在3-6个范围内"
    dimension_id: business_rule_compliance
    subcategory_id: quantity_constraint
    check_type: entity_attribute_equals
    params:
      file_path: "workspace/knowledge_analysis.json"
      field: "key_insights"
      check_subtype: array_length_range
      min_length: 3
      max_length: 6
    description: "knowledge_analysis中的key_insights数量在3-6之间"
    is_gate: false
    is_critical: false
    weight: 1.0

  # ── SOP流程遵循 ──
  - check_id: "sop_write_order"
    check_name: "交付文件按SOP顺序写入"
    dimension_id: business_rule_compliance
    subcategory_id: sop_compliance
    check_type: tool_called_with_params
    params:
      tool_name: "write_file"
      check_subtype: ordered_sequence
      required_sequence:
        - params_contain:
            path: "knowledge_analysis"
        - params_contain:
            path: "video_script"
    description: "先写knowledge_analysis → 再写video_script"
    is_gate: false
    is_critical: false
    weight: 1.0

  # ============================================
  # 维度3: 数据一致性 (data_consistency)
  # ============================================

  - check_id: "concept_coverage_consistency"
    check_name: "知识提炼中的核心概念在脚本中被覆盖"
    dimension_id: data_consistency
    subcategory_id: cross_file_knowledge
    check_type: cross_file_consistency
    params:
      source_file: "workspace/knowledge_analysis.json"
      source_field: "core_concepts[*].concept_name"
      target_file: "workspace/video_script.json"
      target_field: "script_body[*].narration"
      check_subtype: "text_contains_concepts"
    description: "knowledge_analysis中的核心概念在video_script的口播文字中被实际提及"
    is_gate: false
    is_critical: true
    weight: 1.0

  # ============================================
  # 维度4: 内容创作质量 (content_quality)
  # ============================================

  # ── Gate层 ──
  - check_id: "脚本产出存在性"
    check_name: "脚本文件存在且有实际内容"
    dimension_id: content_quality
    subcategory_id: script_content_gate
    quality_tier: gate
    check_type: sop_stage_coverage
    params:
      stage_name: "视频脚本创作"
      required_evidence:
        - type: file_exists
          path: "workspace/video_script.json"
        - type: file_not_empty
          path: "workspace/video_script.json"
          min_size_bytes: 500
    description: "video_script.json文件存在且不是空壳（>500字节）"
    is_gate: true
    is_critical: true
    weight: 1.0

  # ── Basic层: 知识提炼能力 ──
  - check_id: "知识提炼能力基础"
    check_name: "核心概念提取完整，没有遗漏关键内容"
    dimension_id: content_quality
    subcategory_id: knowledge_extraction
    quality_tier: basic
    check_type: semantic_check
    params:
      judge_criteria_file: "check_definitions/judge_criteria/content_quality_basic.yaml"
      judge_section: "knowledge_extraction"
      reference_files:
        - "workspace/knowledge_analysis.json"
      source_files:
        - "workspace/source_materials/"
    description: "LLM评审：核心概念是否识别完整，没有遗漏关键内容"
    is_gate: false
    is_critical: true
    weight: 1.0

  # ── Basic层: 教学设计能力 ──
  - check_id: "教学设计能力基础"
    check_name: "知识排序合理，前后依赖没有颠倒"
    dimension_id: content_quality
    subcategory_id: teaching_design
    quality_tier: basic
    check_type: semantic_check
    params:
      judge_criteria_file: "check_definitions/judge_criteria/content_quality_basic.yaml"
      judge_section: "teaching_design"
      reference_files:
        - "workspace/video_script.json"
        - "workspace/knowledge_analysis.json"
    description: "LLM评审：知识排序是否合理，前置知识是否在后续概念之前讲解"
    is_gate: false
    is_critical: true
    weight: 1.0

  # ── Basic层: 视觉化设计能力 ──
  - check_id: "视觉化设计能力基础"
    check_name: "核心概念都有对应的视觉化方案"
    dimension_id: content_quality
    subcategory_id: visual_design
    quality_tier: basic
    check_type: semantic_check
    params:
      judge_criteria_file: "check_definitions/judge_criteria/content_quality_basic.yaml"
      judge_section: "visual_design"
      reference_files:
        - "workspace/video_script.json"
    description: "LLM评审：核心概念是否都有对应的视觉化方案，不是纯口播"
    is_gate: false
    is_critical: true
    weight: 1.0

  # ── Basic层: 口播质量 ──
  - check_id: "口播质量基础"
    check_name: "口播文字口语化，没有书面连接词"
    dimension_id: content_quality
    subcategory_id: narration_quality
    quality_tier: basic
    check_type: semantic_check
    params:
      check_subtype: keyword_absence
      file_path: "workspace/video_script.json"
      field_path: "script_body[*].narration"
      forbidden_keywords: ["综上所述", "由此可见", "需要指出的是", "在此基础上", "本文将从"]
    description: "口播文字中不包含书面连接词"
    is_gate: false
    is_critical: false
    weight: 1.0

  # ── Basic层: 技术准确性 ──
  - check_id: "技术准确性基础"
    check_name: "核心技术概念解释正确，没有事实性错误"
    dimension_id: content_quality
    subcategory_id: technical_accuracy
    quality_tier: basic
    check_type: semantic_check
    params:
      judge_criteria_file: "check_definitions/judge_criteria/content_quality_basic.yaml"
      judge_section: "technical_accuracy"
      reference_files:
        - "workspace/knowledge_analysis.json"
        - "workspace/video_script.json"
      source_files:
        - "workspace/source_materials/"
    description: "LLM评审：技术概念解释是否正确，与源材料一致"
    is_gate: false
    is_critical: true
    weight: 1.0

  # ── Basic层: 可生产性 ──
  - check_id: "可生产性基础"
    check_name: "时长估算合理，素材清单覆盖脚本视觉元素"
    dimension_id: content_quality
    subcategory_id: producibility
    quality_tier: basic
    check_type: semantic_check
    params:
      judge_criteria_file: "check_definitions/judge_criteria/content_quality_basic.yaml"
      judge_section: "producibility"
      reference_files:
        - "workspace/video_script.json"
    description: "LLM评审：时长估算是否合理，素材清单是否完整"
    is_gate: false
    is_critical: false
    weight: 1.0

  # ── Advanced层: 知识提炼能力 ──
  - check_id: "知识提炼能力进阶"
    check_name: "洞察深刻，捕捉到设计哲学和决策逻辑"
    dimension_id: content_quality
    subcategory_id: knowledge_extraction
    quality_tier: advanced
    check_type: semantic_check
    params:
      judge_criteria_file: "check_definitions/judge_criteria/content_quality_advanced.yaml"
      judge_section: "knowledge_extraction"
      reference_files:
        - "workspace/knowledge_analysis.json"
      source_files:
        - "workspace/source_materials/"
    description: "LLM评审：洞察是否深刻，是否捕捉到隐含的设计决策和方法论"
    is_gate: false
    is_critical: false
    weight: 1.0

  # ── Advanced层: 教学设计能力 ──
  - check_id: "教学设计能力进阶"
    check_name: "学习路径设计精巧，有叙事弧线和钩子"
    dimension_id: content_quality
    subcategory_id: teaching_design
    quality_tier: advanced
    check_type: semantic_check
    params:
      judge_criteria_file: "check_definitions/judge_criteria/content_quality_advanced.yaml"
      judge_section: "teaching_design"
      reference_files:
        - "workspace/video_script.json"
    description: "LLM评审：学习路径是否有精巧设计，叙事弧线和钩子是否吸引人"
    is_gate: false
    is_critical: false
    weight: 1.0

  # ── Advanced层: 视觉化设计能力 ──
  - check_id: "视觉化设计能力进阶"
    check_name: "视觉设计精准服务认知辅助，图表类型选择恰当"
    dimension_id: content_quality
    subcategory_id: visual_design
    quality_tier: advanced
    check_type: semantic_check
    params:
      judge_criteria_file: "check_definitions/judge_criteria/content_quality_advanced.yaml"
      judge_section: "visual_design"
      reference_files:
        - "workspace/video_script.json"
    description: "LLM评审：视觉设计是否精准服务于认知辅助，图表类型选择是否恰当"
    is_gate: false
    is_critical: false
    weight: 1.0

  # ── Advanced层: 口播质量 ──
  - check_id: "口播质量进阶"
    check_name: "口播生动自然，比喻精准且令人印象深刻"
    dimension_id: content_quality
    subcategory_id: narration_quality
    quality_tier: advanced
    check_type: semantic_check
    params:
      judge_criteria_file: "check_definitions/judge_criteria/content_quality_advanced.yaml"
      judge_section: "narration_quality"
      reference_files:
        - "workspace/video_script.json"
    description: "LLM评审：口播是否生动自然，比喻是否精准且有记忆点"
    is_gate: false
    is_critical: false
    weight: 1.0

  # ── Advanced层: 技术准确性 ──
  - check_id: "技术准确性进阶"
    check_name: "技术细节精确，概念关系和边界描述严谨"
    dimension_id: content_quality
    subcategory_id: technical_accuracy
    quality_tier: advanced
    check_type: semantic_check
    params:
      judge_criteria_file: "check_definitions/judge_criteria/content_quality_advanced.yaml"
      judge_section: "technical_accuracy"
      reference_files:
        - "workspace/knowledge_analysis.json"
        - "workspace/video_script.json"
      source_files:
        - "workspace/source_materials/"
    description: "LLM评审：技术细节是否精确，简化时是否损失关键信息"
    is_gate: false
    is_critical: false
    weight: 1.0

  # ── Advanced层: 可生产性 ──
  - check_id: "可生产性进阶"
    check_name: "时间线连续无重叠，动画效果有明确说明"
    dimension_id: content_quality
    subcategory_id: producibility
    quality_tier: advanced
    check_type: semantic_check
    params:
      judge_criteria_file: "check_definitions/judge_criteria/content_quality_advanced.yaml"
      judge_section: "producibility"
      reference_files:
        - "workspace/video_script.json"
    description: "LLM评审：分段时间点是否连续无重叠，可否直接下发制作"
    is_gate: false
    is_critical: false
    weight: 1.0

  # ── Gate层: 多媒体制作 ──
  - check_id: "视频素材包存在性"
    check_name: "videos/目录下有实际的视频素材"
    dimension_id: content_quality
    subcategory_id: multimedia_production
    quality_tier: gate
    check_type: sop_stage_coverage
    params:
      stage_name: "视频素材制作"
      required_evidence:
        - type: directory_exists
          path: "workspace/videos/"
        - type: file_exists
          path: "workspace/videos/slides.pptx"
    description: "视频素材目录存在且包含PPT文件"
    is_gate: true
    is_critical: true
    weight: 1.0

  # ── Basic层: 多媒体制作 ──
  - check_id: "多媒体制作能力基础"
    check_name: "视频有PPT和配音文件"
    dimension_id: content_quality
    subcategory_id: multimedia_production
    quality_tier: basic
    check_type: entity_attribute_equals
    params:
      check_subtype: multimedia_completeness
      ppt_path: "workspace/videos/slides.pptx"
      audio_path: "workspace/videos/narration.mp3"
      manifest_path: "workspace/videos/manifest.json"
    description: "视频素材包至少包含PPT和配音文件，有manifest清单"
    is_gate: false
    is_critical: true
    weight: 1.0

  # ── Basic层: 工具调用正确性 ──
  - check_id: "create_ppt_called"
    check_name: "调用了create_ppt工具"
    dimension_id: content_quality
    subcategory_id: multimedia_production
    quality_tier: basic
    check_type: tool_called_with_params
    params:
      tool_name: "create_ppt"
      min_call_count: 1
    description: "Agent至少调用了一次create_ppt工具来生成PPT"
    is_gate: false
    is_critical: true
    weight: 1.0

  - check_id: "text_to_speech_called"
    check_name: "调用了text_to_speech工具"
    dimension_id: content_quality
    subcategory_id: multimedia_production
    quality_tier: basic
    check_type: tool_called_with_params
    params:
      tool_name: "text_to_speech"
      min_call_count: 1
    description: "Agent至少调用了一次text_to_speech工具来生成配音"
    is_gate: false
    is_critical: true
    weight: 1.0

  # ── Advanced层: 多媒体制作 ──
  - check_id: "多媒体制作能力进阶"
    check_name: "PPT内容与脚本一致，配音覆盖所有段落"
    dimension_id: content_quality
    subcategory_id: multimedia_production
    quality_tier: advanced
    check_type: semantic_check
    params:
      judge_criteria_file: "check_definitions/judge_criteria/content_quality_advanced.yaml"
      judge_section: "multimedia_production"
      reference_files:
        - "workspace/video_script.json"
        - "workspace/videos/"
    description: "LLM评审：PPT页数与脚本段落数是否对应，配音是否覆盖所有口播段"
    is_gate: false
    is_critical: false
    weight: 1.0
