# Check 能力维度分层体系 — knowledge_video_creator 场景
# 三层结构：Dimension (维度) → Subcategory (子类) → Check Item (检查项)

version: "1.0"
created_at: "2026-02-19"
description: |
  技术知识讲解视频创作场景的能力维度定义。
  核心评估四个能力：知识提炼能力、教学设计能力、视觉化设计能力、**多媒体生产Pipeline编排能力**。
  与novel_to_script的关键区别：
  1. 源材料是技术文档而非小说
  2. 输出不只是JSON文档，而是PPT+TTS+配图的视频素材包
  3. 评估重点除了内容质量，还包括多媒体工具调用的正确性和完整性
scenario_type: "knowledge_video_creator"

# ============================================
# 能力维度定义
# ============================================

capability_dimensions:

  # ── 维度1: 格式规范遵循 ──────────────────
  - dimension_id: "format_compliance"
    dimension_name: "格式规范遵循"
    core_capability: "Prompt遵循（格式部分）"
    description: "验证输出文件的JSON语法、Schema合规性"

    subcategories:
      - subcategory_id: "json_syntax"
        subcategory_name: "JSON语法正确性"
        description: "JSON文件的语法正确性（括号、引号、逗号等）"
        check_types: ["json_schema"]

      - subcategory_id: "structural_integrity"
        subcategory_name: "结构完整性"
        description: "JSON结构、必需字段完整性验证"
        check_types: ["json_schema", "entity_attribute_equals"]

  # ── 维度2: 业务规则遵循 ──────────────────
  - dimension_id: "business_rule_compliance"
    dimension_name: "业务规则遵循"
    core_capability: "Prompt遵循（业务逻辑部分）"
    description: "验证SOP流程执行、交付完整性、Skill读取、数量约束等业务规则"

    subcategories:
      - subcategory_id: "output_completeness"
        subcategory_name: "交付完整性"
        description: "两个核心交付文件（knowledge_analysis + video_script）是否都已生成"
        check_types: ["entity_attribute_equals"]

      - subcategory_id: "skill_reading"
        subcategory_name: "知识库读取"
        description: "验证Agent是否在创作前读取了必需的Skill文件和源材料"
        check_types: ["tool_called_with_params"]

      - subcategory_id: "quantity_constraint"
        subcategory_name: "数量约束"
        description: "概念数量、要点数量等数量要求"
        check_types: ["entity_attribute_equals"]

      - subcategory_id: "sop_compliance"
        subcategory_name: "SOP流程遵循"
        description: "是否按照阅读→知识提炼→视频脚本→素材制作的顺序执行"
        check_types: ["tool_called_with_params"]

  # ── 维度3: 数据一致性 ──────────────────
  - dimension_id: "data_consistency"
    dimension_name: "数据一致性"
    core_capability: "多源信息深度融合与洞察"
    description: "验证跨文件、跨阶段的数据引用一致性"

    subcategories:
      - subcategory_id: "cross_file_concept"
        subcategory_name: "概念跨文件一致性"
        description: "核心概念在知识提炼→视频脚本两个文件中保持一致"
        check_types: ["cross_file_consistency", "entity_attribute_equals"]

      - subcategory_id: "cross_file_knowledge"
        subcategory_name: "知识点跨文件一致性"
        description: "知识提炼中的核心概念在脚本中实际覆盖"
        check_types: ["cross_file_consistency"]

  # ── 维度4: 内容创作质量 ──────────────────
  - dimension_id: "content_quality"
    dimension_name: "内容创作质量"
    core_capability: "结合领域知识的自主规划"
    description: |
      验证视频教程内容的质量。分三个核心维度评估：
      知识提炼能力（从技术文档提取核心洞察）、教学设计能力（学习路径规划）、视觉化设计能力（抽象概念→可视化）。
      
      采用三层评估体系：
      - Gate层：门控检查，任何一项失败直接大幅扣分
      - Basic层（及格线）：必须达标的质量底线
      - Advanced层（优秀度）：优秀作品的标准

    quality_tiers:
      tiers:
        - tier_id: "gate"
          tier_name: "门控检查"
          description: "最严重的质量问题，任何一项失败直接大幅扣分"
          examples:
            - "脚本文件是空壳（无实际内容段落）"

        - tier_id: "basic"
          tier_name: "基础质量"
          description: "必须达标的质量底线，决定作品是否及格"
          evaluation_focus: "内容是否可用、是否完成了从文档到视频的形态转换"

        - tier_id: "advanced"
          tier_name: "优秀质量"
          description: "优秀教程的标准，决定作品是否出色"
          evaluation_focus: "内容是否引人入胜、教学效果是否优秀"

      quality_level_calculation: |
        - 不合格: basic层有任何失败
        - 合格: basic全部通过 + advanced通过率 < 70%
        - 优秀: basic全部通过 + advanced通过率 ≥ 70%

    # ── 内容质量子类 ──
    subcategories:

      # Gate层
      - subcategory_id: "script_content_gate"
        subcategory_name: "脚本内容门控"
        description: "脚本文件不能是空壳，必须有实际的口播文字和画面描述"
        quality_tier: "gate"
        check_types: ["sop_stage_coverage"]

      # === 知识提炼能力 ===
      - subcategory_id: "knowledge_extraction"
        subcategory_name: "知识提炼能力"
        description: |
          从源技术文档中识别并提取核心概念、关键洞察、设计决策。
          这是创作的第一道关：理解源材料。
        core_capability_mapping: "复杂上下文理解 + 多源信息深度融合"
        supports_quality_tiers: true

        evaluation_criteria:
          basic: "核心概念识别完整，没有遗漏关键内容"
          advanced: "洞察深刻，捕捉到源材料中隐含的设计哲学和决策逻辑"

        detailed_evaluation_aspects:
          - "核心概念覆盖完整性（源材料中的关键概念是否都被识别）"
          - "概念理解准确性（概念定义是否正确，不歪曲原意）"
          - "关键洞察深度（是否捕捉到表面知识背后的设计决策）"
          - "难点识别准确性（是否正确识别了对观众最难理解的概念）"
          - "依赖关系分析（概念间的前后置关系是否识别正确）"

      # === 教学设计能力 === ⭐ 最核心
      - subcategory_id: "teaching_design"
        subcategory_name: "教学设计能力"
        description: |
          将知识体系重组为适合视频教学的学习路径。
          这是创作最核心的能力：不是照搬文档目录，而是按学习逻辑重新组织。
        core_capability_mapping: "结合领域知识的自主规划（教学设计领域知识）"
        supports_quality_tiers: true

        evaluation_criteria:
          basic: "知识排序合理，前后有依赖关系的概念没有颠倒"
          advanced: "学习路径设计精巧，有渐进式难度曲线和引人入胜的叙事弧线"

        detailed_evaluation_aspects:
          - "知识排序合理性（拓扑排序正确，先讲基础再讲进阶）"
          - "内容均衡性（各段落信息量适中，不过载也不太少）"
          - "钩子设计（开场是否有吸引人的问题或场景）"
          - "叙事弧线（是否用问题→探索→解决的结构组织内容，而非罗列知识点）"
          - "学习目标明确性（知识目标是否清晰可衡量）"
          - "前置知识管理（首次出现的术语是否有解释）"

      # === 视觉化设计能力 ===
      - subcategory_id: "visual_design"
        subcategory_name: "视觉化设计能力"
        description: |
          将抽象技术概念转化为可视化方案（PPT、图表、代码演示）。
          这是从"文档"到"视频"的关键转换：文字如何变成画面。
        core_capability_mapping: "结合领域知识的自主规划（视觉设计领域知识）"
        supports_quality_tiers: true

        evaluation_criteria:
          basic: "每个概念都有对应的视觉化方案，不是纯口播"
          advanced: "视觉设计精准服务于认知辅助，图表类型选择恰当，有渐进展示动画设计"

        detailed_evaluation_aspects:
          - "视觉化覆盖率（核心概念是否都有对应的视觉素材）"
          - "图表类型选择（流程用流程图、对比用对比表、架构用架构图）"
          - "素材描述详细度（是否足够让设计师直接制作）"
          - "代码展示设计（是否有高亮行、注释、运行结果）"
          - "视觉叙事连贯性（前后视觉元素风格一致，有呼应）"

      # === 口播质量 ===
      - subcategory_id: "narration_quality"
        subcategory_name: "口播质量"
        description: |
          口播文字的口语化程度、比喻恰当性、节奏控制。
          检查脚本是否真的像"说"出来的，而非"读"出来的。
        core_capability_mapping: "Prompt遵循（写作风格部分）"
        supports_quality_tiers: true

        evaluation_criteria:
          basic: "口播文字口语化，没有书面连接词，比喻基本准确"
          advanced: "口播生动自然，比喻精准且令人印象深刻，节奏张弛有度"

        detailed_evaluation_aspects:
          - "口语化程度（禁止：综上所述、由此可见、需要指出的是等书面语）"
          - "比喻恰当性（比喻映射关系准确，不为通俗牺牲准确）"
          - "节奏控制（短句为主、有停顿标记、有问句打破单调）"
          - "术语解释（首次出现的专业术语是否有简短解释）"

      # === 技术准确性 ===
      - subcategory_id: "technical_accuracy"
        subcategory_name: "技术准确性"
        description: |
          讲解内容与源材料的事实一致性。
          这是教学内容的底线：不能为了通俗而歪曲技术事实。
        supports_quality_tiers: true

        evaluation_criteria:
          basic: "核心技术概念解释正确，没有事实性错误"
          advanced: "技术细节精确，概念间的关系和边界描述严谨"

        detailed_evaluation_aspects:
          - "概念定义准确性（与源材料一致，不歪曲）"
          - "技术细节正确性（数据、流程、架构描述准确）"
          - "源材料引用准确性（引用的案例和数据可溯源）"
          - "简化合理性（为观众简化时不损失关键信息）"

      # === 可生产性 ===
      - subcategory_id: "producibility"
        subcategory_name: "可生产性"
        description: |
          视频脚本作为生产指令的可执行性。
          检查脚本结构是否适合实际视频制作：
          时长估算合理、素材清单完整、分段时间点连续。
        core_capability_mapping: "结合领域知识的自主规划（视频制作领域知识）"
        supports_quality_tiers: true

        evaluation_criteria:
          basic: "时长估算在合理范围内，素材清单覆盖脚本中提到的所有视觉元素"
          advanced: "分段时间点连续无重叠，动画效果有明确说明，可直接下发制作"

        detailed_evaluation_aspects:
          - "时长估算合理性（视频8-20分钟，与内容量匹配）"
          - "素材清单完整性（脚本中提到的每个视觉元素在清单中都有定义）"
          - "时间线连续性（timestamp从00:00开始，递增，无重叠）"
          - "分段粒度合理性（每段30秒-3分钟，太短碎片化太长难以管理）"

      # === 多媒体制作能力 === ⭐ 本场景独有
      - subcategory_id: "multimedia_production"
        subcategory_name: "多媒体制作能力"
        description: |
          Agent是否成功调用多媒体工具生成了PPT、配音、配图等视频素材。
          这是本场景与其他创意场景的核心区别：不只是写文档，还要真正制作视频素材。
          测试Agent编排多工具生产Pipeline的能力。
        core_capability_mapping: "任务规划与工具组合"
        supports_quality_tiers: true

        evaluation_criteria:
          basic: "视频有PPT和配音文件，manifest.json记录了所有素材"
          advanced: "PPT内容与脚本一致、配音覆盖所有口播段落、图片与描述匹配"

        detailed_evaluation_aspects:
          - "PPT生成完整性（有slides.pptx，页数与脚本段落数对应）"
          - "配音生成完整性（有narration.mp3，覆盖所有口播段落）"
          - "配图生成（关键概念有对应的图片素材）"
          - "素材清单完整性（manifest.json记录了所有文件路径和播放顺序）"
          - "工具调用合理性（PPT/TTS/Image工具参数正确，没有无效调用）"

# ============================================
# 使用说明
# ============================================

usage_notes: |
  1. check_list中每个check_item必须标注：
     - dimension_id: 能力维度
     - subcategory_id: 子类
     - quality_tier: (仅content_quality维度需要) gate/basic/advanced

  2. 内容质量评估需要对照源技术文档（source_materials/），
     这是二创场景的核心——有"原始素材"可以锚定准确性。

  3. 统计分析按维度聚合：
     - format_compliance: 格式层通过率
     - business_rule_compliance: 流程层通过率  
     - data_consistency: 一致性层通过率
     - content_quality: 内容层评分（gate→basic→advanced三级）

  4. 总分计算（与novel_to_script对齐）：
     Total = Content × 0.7 + Process × 0.3
     Content = 60 - gate_penalty - basic_deduction + advanced_bonus
     Process = average(format, business_rule, data_consistency) × 100
