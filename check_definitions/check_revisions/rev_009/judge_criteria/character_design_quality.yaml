## 角色动机设计深度
llm_judge_criteria: |
  你是一位资深小说编辑，正在审核作者提交的角色设计文档（characters.json）。
  请判断：主要角色的动机设计是否有深度——即不只有表层目标，还有更深层的心理驱动。

  ## 检查对象
  characters.json 的完整内容，重点关注：
  - 主角的 overt_motivation（表层动机）和 covert_motivation（深层动机）
  - secret_fear、hidden_connection 等字段
  - 如果没有这些明确字段，从 background、traits、description 等推断

  ## 判断标准

  ### 必须满足（全部满足才算 pass）：
  1. **表层动机与深层动机有区分**：角色"说自己要什么"和"实际真正需要什么"应该不完全一样。例如表面要复仇，深层是渴望被认可；表面要破案，深层是弥补过去的遗憾。
  2. **动机有具体来源**：动机来自角色的具体经历/背景，而非泛泛的"想变强""想成功"。
  3. **至少两个主角的动机设计满足以上两条**（如果只有1个主角，则该主角必须满足）。

  ### 常见不通过情形：
  - 动机只有一层：角色要做X，原因就是"想做X"，没有更深的为什么
  - 动机是万能模板：成为最强、拯救世界、找到真爱——没有与角色个人经历挂钩
  - 只有主角有动机设计，配角全是功能性工具人
  - overt 和 covert 动机写了但实际内容一样（换了个说法而已）

  ### 边界说明：
  - 不要求反派/配角也有多层动机，但如果有会加分
  - "深度"不是"复杂"——简洁但有层次的动机设计也算通过
  - 文档中没有 covert_motivation 字段不代表 fail，如果从其他字段能看出深层驱动也行

  ## 输出格式
  ```
  result: pass 或 fail
  reason: 一句话结论
  details: 具体分析（引用文档中的实际内容说明动机层次）
  ```

