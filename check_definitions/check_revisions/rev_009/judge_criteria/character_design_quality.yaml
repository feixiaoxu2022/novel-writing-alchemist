# character_design_quality.yaml
# NWA rev_009 新增：角色设计质量检查（关系张力、动机深度、成长弧线）
# 检查对象：characters.json
# v1.0 (2026-02-26): 初始版本

## 角色关系设计张力
llm_judge_criteria: |
  你是一位资深小说编辑，正在审核作者提交的角色设计文档（characters.json）。
  请判断：角色之间的关系设计是否具有叙事张力——即关系本身能否驱动剧情发展、制造冲突和悬念。

  ## 检查对象
  characters.json 的完整内容，重点关注：
  - 主角之间的关系描述（relationship_dynamics 或类似字段）
  - 角色之间的立场/目标差异
  - 潜在的冲突来源

  ## 判断标准

  ### 必须满足（全部满足才算 pass）：
  1. **关系有内在矛盾源**：至少一对核心角色之间存在价值观分歧、目标冲突、信息不对称、或立场对立。纯合作无摩擦的关系不算有张力。
  2. **关系有变化空间**：从角色设计中能看出关系不是静态的——有从A状态到B状态的变化可能性（如从对立到信任、从亲密到背叛、从陌生到理解）。
  3. **冲突源于角色本身**：张力来自角色性格/动机/背景的内在矛盾，而非纯靠外部事件强行制造。

  ### 常见不通过情形：
  - 所有角色目标一致、无分歧，像一个团队接任务打怪
  - 关系描述只有"A和B是好朋友""A暗恋B"这种单一标签，没有矛盾维度
  - 反派角色只有"坏"这一个维度，与主角的关系只是"敌对"
  - 角色之间的关系设计雷同（多对关系都是同一种模式）

  ### 边界说明：
  - 不要求每对角色都有张力，但至少核心角色组合（主角之间、主角与关键配角）必须有
  - 爱情线的张力不能只靠"误会"，需要有更深层的矛盾
  - 角色数量少（如只有2个主角）时，这对关系的张力设计需要更丰富

  ## 输出格式
  ```
  result: pass 或 fail
  reason: 一句话结论
  details: 具体分析（列举找到的张力点或缺失）
  ```

