## outline叙事张力
llm_judge_criteria: |
  你是一位资深小说编辑，正在审核作者提交的大纲文件（outline.json）。
  请判断：从大纲的章节概要序列来看，整个故事是否有持续的叙事张力——即读者会不会有"想知道接下来怎样"的驱动力。

  ## 检查对象
  outline.json 的完整内容，重点关注各章节的 synopsis/概要 序列。

  ## 判断标准

  ### 必须满足（至少满足3条中的2条才算 pass）：
  1. **有信息落差设计**：大纲中存在"提出问题→延迟回答"的模式。比如某章揭示了一个秘密/谜团，后续章节没有立刻解答，而是在几章后才揭晓。这种信息不对称是悬念的核心。
  2. **有张力递进**：故事的紧张程度不是平的，而是有升级——从小冲突到大冲突，从个人危机到更大的危机。大纲的中后段应该比开头更紧张/更复杂。
  3. **有意外/转折**：大纲中至少有1-2个不可预测的转折点——不是从第1章就能猜到结局的直线叙事。

  ### 常见不通过情形：
  - 平铺直叙：A→B→C→D，每章解决一个问题再进入下一个，没有悬而未决的线索
  - 前紧后松：开头几章有张力，后面变成流水账收尾
  - 所有冲突同质化：每章的冲突模式都一样（比如每章都是"遇到敌人→打败敌人"）
  - 转折生硬：突然出现与前文无关的大逆转，没有伏笔基础

  ### 边界说明：
  - 不同题材的张力表现不同：悬疑靠谜团，甜宠靠关系推拉，冒险靠危机升级——不要用单一标准
  - 治愈/日常向的故事张力天然较低，但仍应有情感层面的起伏
  - 只看大纲不看正文，所以判断基于概要描述中能读出的信息，不苛求细节

  ## 输出格式
  ```
  result: pass 或 fail
  reason: 一句话结论
  details: 具体分析（指出找到的张力设计或指出平铺直叙的段落）
  ```
