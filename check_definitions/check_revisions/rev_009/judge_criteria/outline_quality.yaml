# outline_quality.yaml
# NWA rev_009 新增：大纲质量检查（结构完整性、叙事张力）
# 检查对象：outline.json (+ outline_act2_part1.json, outline_act2_part2.json, outline_act3.json 如果存在)
# v1.0 (2026-02-26): 初始版本

## outline结构完整性
llm_judge_criteria: |
  你是一位资深小说编辑，正在审核作者提交的大纲文件（outline.json）。
  请判断：大纲的结构是否足够完整，能够支撑后续写作。

  ## 检查对象
  outline.json 的完整内容。

  ## 判断标准

  ### 必须满足（全部满足才算 pass）：
  1. **章节覆盖完整**：大纲覆盖了故事从开头到结尾的全部章节（或至少覆盖了计划写作章节的80%以上）。不能只有前几章的大纲就结束。
  2. **每章有实质性内容描述**：每个章节至少有 synopsis/概要 描述核心事件，不能只有"第X章：XXX"这样的标题。
  3. **包含冲突/转折信息**：大纲中至少部分章节包含了冲突点、情绪转折、或场景级别的细化描述（scene_sequence、conflict_point 等）。纯流水账式的事件列表不算。
  4. **三幕/多幕结构可辨识**：大纲有明确的结构分层（act_one/act_two/act_three 或类似的阶段划分），而非所有章节平铺。

  ### 常见不通过情形：
  - 大纲只有3-5个章节的概要，远少于计划的总章节数
  - 每章 synopsis 只有一句话（<30字），信息量不足以指导写作
  - 全篇没有任何冲突、转折的描述，只是"A做了X，然后做了Y，然后做了Z"
  - 没有结构分层，所有章节堆在一起

  ### 边界说明：
  - 短篇（ultra_short，5章以内）的大纲自然会短，降低对章节数的要求，但每章的信息密度应该更高
  - 不同模型的 outline 格式不同（有的有 scene_sequence，有的没有），不惩罚格式差异，只看信息量
  - 大纲分成多个文件（outline.json + outline_act2_part1.json 等）是正常的，合并起来看总量

  ## 输出格式
  ```
  result: pass 或 fail
  reason: 一句话结论
  details: 具体分析（大纲覆盖了多少章节、信息密度如何、结构层次如何）
  ```

